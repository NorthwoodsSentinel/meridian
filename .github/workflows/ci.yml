# CI: runs on pull requests the same checks `bun run local:gate` runs locally (format check,
# lint, typecheck, tests with the per-file 90% coverage bar and the gate-scope check). Steps
# call the individual scripts rather than `local:gate`, so each check reports on its own line.
#
# This workflow NEVER deploys or publishes. It holds no secret and its token is read-only.
name: CI

on:
  pull_request:

# Least privilege for GITHUB_TOKEN: nothing here writes to the repo.
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    # Hung-job guard, not a flake remedy. The local gate takes seconds.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned exactly; matches the version the gate was measured with.
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
